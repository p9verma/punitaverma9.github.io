- name: Longformer Attention Research
  descr:
  - Implemented sliding-window attention from Longformer in a GPT-style transformer to study long-context efficiency and scalability.
  - Compared standard self-attention and sliding-window attention on WikiText-103 using compute complexity, cross-entropy
    loss, and perplexity.
  demo: https://github.com/p9verma/longformer/blob/main/ChatGPTfromScratch_Final_Report_Verma.pdf
  tags:
  - tag: Transformer
  - tag: LLM
  - tag: Efficient Attention
  - tag: Long sequence analysis
- name: Financial Advising Agent
  descr:
  - Built a financial RAG application with OpenAI APIs, LangChain, and SEC EDGAR data to retrieve source information and generate
    context-aware responses.
  - Evaluated hallucination rates, precision, recall, and response times with RAGAS.
  demo: https://github.com/peterphan1101/Artificial_Intelligence_Projects/tree/main
  tags:
  - tag: RAG
  - tag: LangChain
  - tag: Prompt Augmentation
- name: ChatGPT from Scratch
  descr:
  - Implemented GPT architecture in PyTorch, including token embeddings, positional encoding, and multi-head attention; trained
    on WikiText-103.
  tags:
  - tag: PyTorch
  - tag: Transformers
  - tag: Language Modeling
- name: ML Capstone Project Multi-pronged Attention Network for Stock Forecasting (MAN-SF)
  descr:
  - Developed an ML model integrating multiple data modalities, such as social media text (sentiment analysis) and time series
    data, to enhance stock price forecasting accuracy and understanding of market trends.
  - Improved model accuracy by 12% over standard methods and demonstrated the effectiveness of PCA in reducing noise in stock
    market data.
  - Evaluated the model using real-time stock data and presented findings.
  demo: https://github.com/cherh63/ML-StockPredict/blob/main/Project%20Report.pdf
  tags:
  - tag: MAN-SF
  - tag: Multimodal
  - tag: Sentiment Analysis
  - tag: Time Series
- name: Big Fat Charity
  descr:
  - Winner, HackDuke Capital One Best Financial Hack, created an application to allow users to make informed and efficient
    charity donations using Big Data analysis.
  - Used Google Maps API to visualize and compare charity needs and information from over 8000 charities.
  - Provided an interactive map to visualize charity need in the US on five metrics and average overall score using Google
    Maps API.
  demo: https://github.com/bubbajoe/BigFatCharity
  tags:
  - tag: Big Data Visualization
  - tag: Google Maps API
  - tag: JavaScript
